name: CI Test Suite & Concurrency Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Unit & Integration Tests (Real Redis)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite against Real Redis Service
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          TEST_REAL_REDIS: "true"
          ADMIN_API_KEY: "admin-secret-key-123"
        run: npm test

      - name: Run Naive Race Condition Demonstration
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: node scripts/demo-naive-race.js
