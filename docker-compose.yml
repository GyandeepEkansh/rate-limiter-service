services:
  redis:
    image: redis:7-alpine
    container_name: rate-limiter-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rate-limiter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rate-limiter-service
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DEFAULT_ALGORITHM=token_bucket
      - DEFAULT_RATE=10
      - DEFAULT_BURST=20
      - DEFAULT_LIMIT=100
      - DEFAULT_WINDOW_SECONDS=60
      - ADMIN_API_KEY=${ADMIN_API_KEY:-admin-secret-key-123}
      - FAIL_OPEN=${FAIL_OPEN:-false}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
    driver: local
